<text x="292" y="72" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Bot process (Node, Mineflayer)</text>
<text x="292" y="92" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">observe: visible blocks only, no x-ray</text>
<text x="292" y="109" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">planner: pure function of the state</text>
<text x="292" y="126" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">skills: explore, dig_down, mine, craft,</text>
<text x="292" y="143" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">smelt, shelter, flee, fight, deposit</text>
