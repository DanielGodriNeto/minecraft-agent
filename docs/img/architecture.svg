<text x="632" y="72" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Telemetry</text>
<text x="632" y="92" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">one JSON line per skill call</text>
<text x="632" y="109" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">per-run milestone timeline</text>
<text x="632" y="126" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">stuck tracker and watchdogs</text>
