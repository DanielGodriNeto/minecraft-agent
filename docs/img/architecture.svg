<line x1="720" y1="162" x2="720" y2="214" stroke="#52606d" stroke-width="1.4" marker-end="url(#a)"/>
<text x="720.0" y="182.0" font-size="10.5" fill="#6b7785" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">aggregate</text>
<line x1="620" y1="260" x2="550" y2="260" stroke="#52606d" stroke-width="1.4" marker-end="url(#a)"/>
<text x="585.0" y="254.0" font-size="10.5" fill="#6b7785" text-anchor="middle" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">decisions</text>
