<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 326" width="840" height="326" role="img">
<rect width="840" height="326" fill="#ffffff" rx="6"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52606d"/></marker></defs>
<text x="20" y="28" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Architecture</text>
<rect x="20" y="50" width="190" height="112" fill="#f4f7f9" stroke="#c5ced6" rx="5"/>
<text x="32" y="72" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Paper server</text>
<text x="32" y="92" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Minecraft 1.21, one pinned patch</text>
<text x="32" y="109" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">600 pre-generated spawn slots</text>
<text x="32" y="126" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Fresh world snapshot per batch</text>
