<text x="292" y="236" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Evaluation harness</text>
<text x="292" y="256" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">fixed slots, paired arms behind switches</text>
<text x="292" y="273" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">12 bots per server, up to 3 servers</text>
<rect x="620" y="214" width="200" height="92" fill="#f4f7f9" stroke="#c5ced6" rx="5"/>
<text x="632" y="236" font-size="13" fill="#1f2933" text-anchor="start" font-weight="bold" font-family="Segoe UI, Helvetica, Arial, sans-serif">Analysis</text>
<text x="632" y="256" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">runs.csv, REPORT.md</text>
<text x="632" y="273" font-size="11.5" fill="#6b7785" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">failure signatures, timelines</text>
